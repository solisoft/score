  footer:
    label: "Le site"
    about: "<strong>Score</strong> écrit, joue et partage des partitions dans le navigateur. Son graveur, <strong>eui-score</strong>, est celui d'<a href=\"https://eui.solisoft.net\">EUI</a> : la part de LilyPond qu'il lit est gravée en tracés, jouée en MIDI et imprimée en PDF. Chaque partition de ce site est gravée à la volée par lui — sur le serveur, ou dans votre navigateur."
    credits: "Glyphes musicaux : Emmentaler (OFL). Texte des partitions : TeX Gyre Schola (GUST Font License). Sons : <a href=\"/soundfonts/MuseScore_General_License.txt\">MuseScore_General</a> (MIT), joués par <a href=\"https://github.com/spessasus/spessasynth_lib\">SpessaSynth</a> (Apache 2.0). Fait avec <a href=\"https://solisoft.net\">Soli</a>."
