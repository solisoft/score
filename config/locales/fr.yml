  home:
    eyebrow: "Un éditeur de partitions dans votre navigateur"
    headline: "Écrire, jouer et partager des partitions, <em>ensemble</em>, dans le navigateur."
    lead: "Score, c'est là où vous écrivez la musique : à la souris ou au clavier, entendue au fur et à mesure, travaillée avec votre micro, et partagée avec d'autres, en direct. Rien à installer."
    start: "Commencer gratuitement"
    playground: "Ouvrir le bac à sable"
    note: "Gratuit pour écrire, sans carte. <a href=\"{pricing}\">Pro</a> ajoute l'IA avec votre propre clé, plus d'audio, et le partage avec tout le monde."
    hero_alt: "L'éditeur Score : Au clair de la lune pour voix et piano, avec accords et paroles."
    index_label: "Ce que fait l'app"
    developers: "Pour les développeurs"
    try_playground: "Essayer le bac à sable"
    dev_title: "Le graveur intégré, à intégrer chez vous."
    dev_lead: "Chaque partition ici est dessinée par <strong>eui-score</strong>, le graveur d'EUI : il lit le LilyPond et le grave en tracés vectoriels, le joue en MIDI et l'imprime en PDF. Compilé en WebAssembly, il tourne sur n'importe quelle page avec deux balises."
    the_guide: "Le guide"
    the_syntax: "La syntaxe"
    embed_it: "L'intégrer"
    examples: "Les {n} exemples"
    plans: "Offres"
    plans_title: "Gratuit pour écrire. Pro pour aller plus loin."
    for_good: "pour toujours"
    free_text: "L'éditeur, la lecture, le PDF et le MIDI, les versions, les commentaires et le partage. Sans carte."
    per_month: "par mois"
    pro_text: "L'IA avec votre propre clé, toutes les pistes audio et plus de place pour les prises, une partition partagée avec tout le monde."
    compare: "Comparer les offres"
    cta: "Votre prochaine partition commence ici."
    see_pricing: "Voir les tarifs"
    title: "Écrire, jouer et partager des partitions, ensemble"
    description: "Score est un éditeur de partitions dans le navigateur : écrivez à la souris ou au clavier, écoutez, travaillez à plusieurs en direct, pratiquez avec le micro, et partagez. Gratuit pour commencer."
    features:
      editor:
        eyebrow: "L'éditeur"
        title: "À la souris, au clavier, ou les deux."
        l1: "Cliquez une note et changez-la, ou appuyez sur N et tapez les lettres : chaque commande a son raccourci."
        l2: "Trois et quatre voix sur une portée, une ligne d'accords, des couplets de paroles, des petites notes, des doigtés."
        l3: "Annuler remonte aussi loin que vous voulez, et survit à un rechargement."
        alt: "L'éditeur de partitions : un quatuor à cordes, une note sélectionnée et sa palette au-dessus."
        label: "Essayer l'éditeur"
      midi:
        eyebrow: "La vue MIDI"
        title: "Chaque piste d'un coup d'œil, chaque note à portée de main."
        l1: "Un piano roll pour déplacer et étirer les notes, la vélocité de chaque note dessinée à la main."
        l2: "Courbes d'automation, grille de batterie, arpégiateur ; quantification, swing et humanisation."
        alt: "La vue MIDI : quatre pistes en piano roll, les couloirs de vélocité et d'automation dessous."
        label: "Ouvrir la vue MIDI"
      together:
        eyebrow: "Ensemble"
        title: "Deux personnes, une partition, en direct."
        l1: "Écrivez en même temps : vos mesures se fondent avec les leurs, et vous voyez où chacun travaille."
        l2: "Commentez une mesure, répondez, résolvez ; mentionnez quelqu'un avec @ et il est prévenu."
        alt: "Ben modifie un quatuor pendant qu'Anna travaille les mesures de l'alto ; commentaires sur les mesures dans le panneau latéral."
        label: "Écrire ensemble"
      sound:
        eyebrow: "Le son"
        title: "Une table de mixage, un synthé, vos propres sons."
        l1: "Volume, panoramique, muet, solo et effets sur chaque portée ; un synthétiseur, ou une SoundFont à vous."
        l2: "Jouez et enregistrez depuis un clavier MIDI : horloge MIDI, MIDI learn et MPE compris."
        alt: "La table de mixage : une tranche par portée du quatuor, avec volume, panoramique, instrument et effets."
        label: "Écouter"
      practice:
        eyebrow: "Micro et pratique"
        title: "Chantez ou jouez, la partition vous écoute."
        l1: "Enregistrez des pistes audio, transformez une prise en notes, accordez-vous avec l'accordeur."
        l2: "Le mode pratique vous suit dans la partition ; jouez-la transposée, plus lente ou plus rapide."
        l3: "Une boucle qui accélère à chaque passage, jusqu'à ce que vous soyez au tempo."
        alt: "L'accordeur lit un la quelques cents trop haut, au-dessus du quatuor à cordes qu'il accorde."
        label: "Commencer à travailler"
      ai:
        eyebrow: "L'IA, avec Pro"
        title: "Une photo devient une partition."
        l1: "Photographiez une partition imprimée ou manuscrite : un modèle d'IA la lit et en fait une partition modifiable."
        l2: "Un assistant propose des accords, un accompagnement, des améliorations, avec votre propre clé d'IA."
        alt: "La page Démarrer : modèles de nouvelle partition, Importer un fichier, et Depuis une photo."
        label: "Voir Pro"
      files:
        eyebrow: "Import et export"
        title: "Entrée et sortie, dans les formats que vous utilisez."
        l1: "Ouvrez du MusicXML, du MIDI et du LilyPond ; enregistrez-les, et le son en WAV, MP3 ou pistes séparées."
        l2: "Imprimez un PDF dont le texte se sélectionne, avec en-têtes, pieds de page et parties séparées."
        alt: "Le menu Fichier : ouvrir un fichier ou une photo ; enregistrer en LilyPond, PDF, MIDI, MusicXML, WAV, MP3 ou pistes séparées."
        label: "Ouvrir un fichier"
      sharing:
        eyebrow: "Versions et partage"
        title: "Votre travail, gardé et partagé à votre façon."
        l1: "Chaque version est gardée, avec qui l'a enregistrée ; revenez à n'importe laquelle."
        l2: "Partagez par lien, en public, ou avec des personnes qui peuvent la lire ou la modifier."
        l3: "Exportez toutes vos données, et connectez-vous en deux étapes si vous voulez."
        alt: "Partage d'une partition : toute personne ayant le lien peut la lire ; Ben peut la modifier, Carla peut l'ouvrir."
        label: "Commencer gratuitement"
  examples:
    eyebrow: "Galerie"
    title: "Exemples gravés"
    lead: "Des partitions pour un instrument, pour la voix, le piano, la guitare, la batterie et les ensembles. Chacune est gravée à la demande par eui-score ; ouvrez-la pour l'écouter, lire sa source LilyPond, télécharger son MIDI et son PDF, ou la modifier dans le bac à sable."
