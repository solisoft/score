    categories:
      solos:
        title: "Solos"
        lead: "Une portée, un instrument : nuances, articulations, triolets, clés d'ut et de fa."
      voice:
        title: "Voix et chœur"
        lead: "Les paroles sous les notes, des canons, un chœur à quatre voix, la voix avec piano."
      piano:
        title: "Piano"
        lead: "Grand-portée avec accolade, accords, deux voix sur une portée, longues liaisons."
      guitar:
        title: "Guitare"
        lead: "Arpèges, accords plaqués, noms d'accords en texte, reprises avec fins alternatives."
      drums:
        title: "Batterie et percussions"
        lead: "Grooves à deux voix, timbales en clé de fa, un ensemble de percussions."
      ensembles:
        title: "Ensembles"
        lead: "Quatuor, quintette, trio de jazz, orchestre : crochets, groupes imbriqués, noms abrégés."
