  home:
    eyebrow: "A score editor in your browser"
    headline: "Write, play and share scores, <em>together</em>, in the browser."
    lead: "Score is where you write music: with the mouse or the keyboard, heard as you go, practised with your microphone, and worked on with others, live. Nothing to install."
    start: "Start for free"
    playground: "Open the playground"
    note: "Free to write with, no card. <a href=\"{pricing}\">Pro</a> adds AI on your own key, more audio, and sharing with anyone."
    hero_alt: "The Score editor: Au clair de la lune for voice and piano, with chord names and lyrics."
    index_label: "What the app does"
    developers: "For developers"
    try_playground: "Try the playground"
    dev_title: "The engraver inside, yours to embed."
    dev_lead: "Every score here is drawn by <strong>eui-score</strong>, the engraver of EUI: it reads LilyPond and engraves it into vector paths, plays it as MIDI and prints it as PDF. Compiled to WebAssembly, it runs on any page with two tags."
    the_guide: "The guide"
    the_syntax: "The syntax"
    embed_it: "Embed it"
    examples: "The {n} examples"
    plans: "Plans"
    plans_title: "Free to write with. Pro for more."
    for_good: "for good"
    free_text: "The editor, playback, PDF and MIDI, versions, comments and sharing. No card."
    per_month: "a month"
    pro_text: "AI on your own key, every audio track and more room for takes, a score shared with anyone."
    compare: "Compare the plans"
    cta: "Your next score starts here."
    see_pricing: "See pricing"
    title: "Write, play and share scores, together"
    description: "Score is a score editor in the browser: write with the mouse or the keyboard, play it, edit it together live, practise with the microphone, and share it. Free to start."
    features:
      editor:
        eyebrow: "The editor"
        title: "Write with the mouse, the keyboard, or both."
        l1: "Click a note and change it, or press N and type the letters: the commands have their shortcuts."
        l2: "Three and four voices on a staff, a line of chord names, verses of lyrics, grace notes, fingerings."
        l3: "Undo goes as far back as you like, and survives a reload."
        alt: "The score editor: a string quartet, a note selected and its palette above it."
        label: "Try the editor"
      midi:
        eyebrow: "The MIDI view"
        title: "Every track at a glance, every note in reach."
        l1: "A piano roll to drag and stretch notes, each note's velocity drawn by hand."
        l2: "Automation curves, a drum grid, an arpeggiator; quantize, swing and humanize."
        alt: "The MIDI view: four tracks as a piano roll, the velocity and automation lanes below."
        label: "Open the MIDI view"
      together:
        eyebrow: "Together"
        title: "Two people, one score, live."
        l1: "Edit at the same time: your bars merge with theirs, and you see where each one works."
        l2: "Comment on a bar, answer, resolve; @ someone and they are notified."
        alt: "Ben edits a quartet while Anna works on the viola's bars; comments on bars in the side panel."
        label: "Write together"
      sound:
        eyebrow: "Sound"
        title: "A mixer, a synth, your own sounds."
        l1: "Volume, pan, mute, solo and effects on each staff; a synthesizer, or a SoundFont of your own."
        l2: "Play and record from a MIDI keyboard: MIDI clock, MIDI learn and MPE included."
        alt: "The mixer: a strip for each staff of the quartet, with volume, pan, instrument and effects."
        label: "Hear it"
      practice:
        eyebrow: "Microphone and practice"
        title: "Sing or play, and the score listens."
        l1: "Record audio tracks, turn a take into notes, tune with the tuner."
        l2: "Practice mode follows you through the score; play it transposed, slower or faster."
        l3: "A loop that speeds up each pass, until you are at tempo."
        alt: "The tuner reading an A a few cents sharp, over the string quartet it tunes for."
        label: "Start practising"
      ai:
        eyebrow: "AI, with Pro"
        title: "A photo becomes a score."
        l1: "Photograph printed or handwritten music: an AI model reads it into a score you can edit."
        l2: "An assistant suggests chords, an accompaniment, improvements, on your own AI key."
        alt: "The Start page: new score templates, Import a file, and From a photo."
        label: "See Pro"
      files:
        eyebrow: "Import and export"
        title: "In and out, in the formats you use."
        l1: "Open MusicXML, MIDI and LilyPond; save them back, and the sound as WAV, MP3 or stems."
        l2: "Print a PDF whose text you can select, with headers, footers and parts."
        alt: "The File menu: open a file or a photo; save as LilyPond, PDF, MIDI, MusicXML, WAV, MP3 or stems."
        label: "Open a file"
      sharing:
        eyebrow: "Versions and sharing"
        title: "Your work, kept and shared your way."
        l1: "Every version kept, with who saved it; go back to any of them."
        l2: "Share by link, in public, or with people who may read or change it."
        l3: "Export all your data, and sign in in two steps if you like."
        alt: "Sharing a score: anyone with the link may read it; Ben may change it, Carla may open it."
        label: "Start for free"
  examples:
    eyebrow: "Gallery"
    title: "Engraved examples"
    lead: "Scores for one instrument, for voice, piano, guitar, drums and ensembles. Each one is engraved on demand by eui-score; open it to listen, read its LilyPond source, download its MIDI and PDF, or edit it in the playground."
    families: "Families"
    breadcrumb: "Breadcrumb"
