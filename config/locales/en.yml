  footer:
    label: "The site"
    about: "<strong>Score</strong> writes, plays and shares scores in the browser. Its engraver, <strong>eui-score</strong>, is the engraver of <a href=\"https://eui.solisoft.net\">EUI</a>: the LilyPond subset it reads is engraved into paths, played as MIDI and printed as PDF. Every score on this site is engraved on the fly by it — on the server, or in your browser."
    credits: "Music glyphs: Emmentaler (OFL). Score text: TeX Gyre Schola (GUST Font License). Sounds: <a href=\"/soundfonts/MuseScore_General_License.txt\">MuseScore_General</a> (MIT), played by <a href=\"https://github.com/spessasus/spessasynth_lib\">SpessaSynth</a> (Apache 2.0). Built with <a href=\"https://solisoft.net\">Soli</a>."
