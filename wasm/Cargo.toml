[package]
name = "eui-score-web"
description = "eui-score in the browser: LilyPond engraved to SVG, played as MIDI, printed as PDF, with no server."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Its own workspace: the crate sits beside the Soli app, not inside EUI's.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engraver itself, from eui's main: 562d504 is eui 0.11 (what Soli
# 2.28.2 pins, f137388) with the engraving fixes since (ending brackets,
# neighbouring dynamics, two-voice rests, tempo marks over grace notes, a
# dotted eighth's dot), the sustain pedal, LilyPond 2.24's \jump and
# \fine, notes past their bar line cut into tied notes, and several
# verses of lyrics a staff, ♭ ♯ ♮ in its words, and the paper its
# \paper asks for, 64ths and 128ths, nested tuplets, added-up metres,
# modes, four voices a staff and notes across staves; d0a4419 (what Soli
# 2.28.5 pins) adds gathered bars of rest, clefs and keys changed inside a
# bar, and real LilyPond files: layout settings passed over with warnings,
# breath marks, bowings, cis! and cis?, movements; adc44e0 breaks a title
# too wide for the page between words (#431); 104591c reads LilyPond 2.24's
# \segnoMark 1, \segno over a note, \section, \sectionLabel, \textMark,
# \volta in an \alternative and \harmonic (#433); 7ff6282 answers each
# word's range, what a double click opens (#434); b64978c a chord
# diagram's strings and frets (#436); 291b705 a slur's side written ^( or
# _(, and hairpins under a slur drawn below (#467); 2dee226 a PDF set a
# little smaller, down to 17 pt, when that saves a page (#470); 1250ae9 words
# and marks over the staff clear accidentals and slurs (#668); 0a305ba two
# voices' accents, the first's over its stems, the second's under (#828);
# 8bd3c19 a fermata held half again, then two seconds of breath (#977);
# 0ed95de trills, mordents, turns and rolled chords played (#978);
# 2bdc942 a dynamic under a whole note's tremolo clears its strokes (#982),
# as Soli 2.36.5 pins it; 009e6af accidentals, beams, ledger lines and
# slurs set as LilyPond sets them (#1019), \shape, extra-offset and a
# hairpin's shorten-pair, and where each curve, dynamic and script is
# (#1020), "1." / "2." / "à 2" as the context sets them (#1021), an
# instrument changed mid-staff and \transposition played (#1023), \paper's
# markup spacing (#1025), the other ornaments, fermatas, pedals, tremolos and
# arpeggios, and RhythmicStaff (#1026), and real files: tab tunings, staves
# of different lengths (#1031, #1032); 88db77e a tablature's grace notes,
# dead notes, ties and harmonics, shape notes, Roman numerals (#1026), page
# headers that know a book part's pages, \if, and words between scores and
# title pages as blocks of the page (#1025), as Soli 2.40.2 pins it;
# 83348e1 the four scores the site held and refused, as they are stored
# (#1036, #1037): figured bass in a staff, an ossia under its staff from a
# context the layout defines, Scheme comments, multiplied durations, a
# file that never prints its music; c5be3df a coda sign and a section's
# name after an ending as one mark beside the bracket (5623f33, #939), and
# the rest of LilyPond's scripts — the ornaments with a hook, Haydn's turn,
# heels and toes, the thumb, the ancient signs — in Emmentaler's signs, and
# played (#1039). Move
# this and the server's Soli together. `build.sh` writes the module
# into public/eui-score/, and that output is committed: deploying the site
# needs no Rust.
eui-score = { git = "https://github.com/solisoft/eui", rev = "c5be3df" }
wasm-bindgen = "=0.2.126"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
