[package]
name = "eui-score-web"
description = "eui-score in the browser: LilyPond engraved to SVG, played as MIDI, printed as PDF, with no server."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Its own workspace: the crate sits beside the Soli app, not inside EUI's.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engraver itself, from eui's main: f5f1bc8 is eui 0.11 (what Soli
# 2.28.2 pins, f137388) with the engraving fixes since (ending brackets,
# neighbouring dynamics, two-voice rests, tempo marks over grace notes, a
# dotted eighth's dot), the sustain pedal, LilyPond 2.24's \jump and
# \fine, notes past their bar line cut into tied notes, and several
# verses of lyrics a staff. The browser
# draws those before the server's Soli does; move this
# and the server's Soli together otherwise. `build.sh` writes the module
# into public/eui-score/, and that output is committed: deploying the site
# needs no Rust.
eui-score = { git = "https://github.com/solisoft/eui", rev = "f5f1bc8" }
wasm-bindgen = "=0.2.126"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
