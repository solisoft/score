[package]
name = "eui-score-web"
description = "eui-score in the browser: LilyPond engraved to SVG, played as MIDI, printed as PDF, with no server."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Its own workspace: the crate sits beside the Soli app, not inside EUI's.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engraver itself, at the eui revision Soli pins (lang's Cargo.toml,
# v2.28.2): the browser then draws exactly what the server's
# eui_score_* builtins draw. Move both together. `build.sh` writes the
# module into public/eui-score/, and that output is committed: deploying
# the site needs no Rust.
eui-score = { git = "https://github.com/solisoft/eui", rev = "f137388" }
wasm-bindgen = "=0.2.126"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
