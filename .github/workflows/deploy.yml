# Verify, then deploy the site to score.solisoft.net.
#
# The server-side contract (soli-proxy, already installed there):
#   1. rsync this app into <sites_dir>/<domain>/ — that folder and nothing else;
#   2. `soli-proxy deploy`: the proxy starts the idle slot, waits for its
#      health check, moves the traffic across, then stops the old slot.
#
# The app (/app) keeps accounts and scores in SoliDB: once the server's .env
# names a database (SOLIDB_HOST), each deploy runs its migrations before the
# switch, and the deploy fails unless /health/deep then answers 200 (the
# database answers, no job left far behind). The browser engraver
# (public/eui-score/) is committed, built by wasm/build.sh, so a deploy needs
# no Rust to deploy; the `engraver` job only tests it. See deploy/README.md
# for the one-time server setup.
name: verify & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two pushes close together must not cross in the middle of an rsync, and a
# deployment already running is never interrupted.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned, so CI tests what the server runs. The eui_score_* builtins the
  # site engraves with are in every release since 2.26.0.
  SOLI_VERSION: "2.32.0"
  # `soli test` resets its test databases on SoliDB before it starts.
  SOLIDB_VERSION: "2.3.1"
  # SoliDB's releases publish no checksum: the tarball's SHA-256 is pinned
  # here, next to its version (bump both together). Soli's releases publish
  # a .sha256 beside each tarball, which fetch() checks instead.
  SOLIDB_SHA256: "6116cdfe50db0898c410739169a21a4f169a32f00ba086273262f0ce7b081e00"

jobs:
  verify:
    name: fmt + lint + boot + suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install soli and SoliDB (pinned)
        run: |
          set -euo pipefail
          # A tarball is unpacked only once its SHA-256 matches: the one
          # given as $4, or else the .sha256 the release publishes beside it.
          fetch() {
            local name="$1" repo="$2" want="$3" sum="${4:-}" tmp got url
            tmp="$(mktemp -d)"
            url="https://github.com/$repo/releases/download/v$want/$name-linux-amd64.tar.gz"
            curl -fsSL "$url" -o "$tmp/pkg.tar.gz"
            [ -n "$sum" ] || sum="$(curl -fsSL "$url.sha256" | grep -oE '^[0-9a-f]{64}')"
            echo "$sum  $tmp/pkg.tar.gz" | sha256sum -c - || { echo "$name $want: checksum mismatch" >&2; exit 1; }
            tar -xzf "$tmp/pkg.tar.gz" -C "$tmp"
            sudo install -m 0755 "$(find "$tmp" -type f -name "$name" -perm -u+x | head -1)" "/usr/local/bin/$name"
            got="$("$name" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
            [ "$got" = "$want" ] || { echo "$name: $got installed, $want expected" >&2; exit 1; }
          }
          fetch soli   solisoft/soli_lang "$SOLI_VERSION"
          fetch solidb solisoft/solidb    "$SOLIDB_VERSION" "$SOLIDB_SHA256"

      # The server engraves what the browser's wasm engraves (library cards,
      # shared pages, PDFs): both must pin the same eui revision, or a score
      # the editor draws is refused everywhere else.
      - name: One engraver, in the browser and on the server
        run: |
          set -euo pipefail
          browser="$(grep -oE 'eui-score = \{ git = "[^"]+", rev = "[0-9a-f]+"' wasm/Cargo.toml | grep -oE '[0-9a-f]{7,}"$' | tr -d '"')"
          server="$(curl -fsSL "https://raw.githubusercontent.com/solisoft/soli_lang/v$SOLI_VERSION/Cargo.toml" \
            | grep -oE '^eui-score = \{ git = "[^"]+", rev = "[0-9a-f]+"' | grep -oE '[0-9a-f]{7,}"$' | tr -d '"')"
          echo "browser: $browser — soli $SOLI_VERSION: $server"
          [ -n "$browser" ] && [ "$browser" = "$server" ] || { echo "eui-score differs: pin wasm/Cargo.toml and soli to the same revision" >&2; exit 1; }

      - name: Format
        run: soli fmt --check

      - name: Lint
        run: soli lint

      # The browser engraver is committed, not built here: make sure it is.
      - name: The browser engraver is there
        run: |
          set -euo pipefail
          for f in eui-score.js eui_score_web.js eui_score_web_bg.wasm; do
            [ -s "public/eui-score/$f" ] || { echo "public/eui-score/$f is missing — run wasm/build.sh" >&2; exit 1; }
          done

      # Booting compiles every handler and view: a syntax error, a missing
      # view or a broken route fails here, not in production.
      - name: The app boots and engraves
        run: |
          set -euo pipefail
          soli serve . --port 19555 --workers 1 > /tmp/boot.log 2>&1 &
          pid=$!
          code=000
          for i in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 2 http://127.0.0.1:19555/health || echo 000)"
            [ "$code" = "200" ] && break
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          for path in / /examples /examples/piano/waltz /examples/piano/waltz/score.pdf /embed /playground; do
            got="$(curl -s -o /dev/null -w '%{http_code}' -m 10 "http://127.0.0.1:19555$path" || echo 000)"
            echo "$path -> $got"
            [ "$got" = "200" ] || code="$got"
          done
          kill $pid 2>/dev/null || true
          if [ "$code" != "200" ]; then
            tail -60 /tmp/boot.log >&2
            exit 1
          fi

      - name: Start SoliDB
        run: |
          set -euo pipefail
          val() { grep -E "^$1=" .env.test | head -1 | cut -d= -f2- | tr -d '"'; }
          export SOLIDB_ADMIN_PASSWORD="$(val SOLIDB_PASSWORD)"
          mkdir -p "$RUNNER_TEMP/solidb-data"
          solidb --host 127.0.0.1 --port 6745 --data-dir "$RUNNER_TEMP/solidb-data" > "$RUNNER_TEMP/solidb.log" 2>&1 &
          for i in $(seq 1 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 2 http://127.0.0.1:6745/_api/databases || true)"
            [ "${code:-000}" != "000" ] && exit 0
            sleep 0.5
          done
          tail -40 "$RUNNER_TEMP/solidb.log" >&2
          exit 1

      - name: Suite, coverage at least 90 %
        run: |
          set -o pipefail
          soli test --coverage --coverage-min 90.0 2>&1 | tee "$RUNNER_TEMP/suite.log"
          # The test servers' logs: the next run of soli test writes over them.
          cat /tmp/soli_test_server_w*.log > "$RUNNER_TEMP/suite-servers.log"

      # The e-mails as they leave, read from the inbox a `--dev` test server
      # keeps (#671): their subject and link. The suite above skips them.
      - name: The e-mails, subject and link
        run: |
          set -o pipefail
          SOLI_TEST_SERVER_DEV=1 soli test tests/mail --no-coverage 2>&1 | tee "$RUNNER_TEMP/mail.log"
          # Skipped, they would pass and prove nothing.
          if grep -q "pending" "$RUNNER_TEMP/mail.log"; then
            echo "the mail specs were skipped" >&2
            exit 1
          fi
          cat /tmp/soli_test_server_w*.log >> "$RUNNER_TEMP/mail.log"

      # A mail that could not be sent is a warning, not a failed spec, so it
      # went unseen in green runs (#671). Any one a spec did not make on
      # purpose fails here — the suite's log and its test servers'.
      - name: No e-mail failed
        run: |
          if grep -h "could not be sent" "$RUNNER_TEMP"/suite.log "$RUNNER_TEMP"/suite-servers.log "$RUNNER_TEMP"/mail.log | grep -v "on purpose"; then
            echo "an e-mail could not be sent (above)" >&2
            exit 1
          fi

      # The app as someone uses it, in a real headless Chrome (installed on
      # GitHub's Ubuntu runners): sign up, write, reload, versions, sharing.
      - name: The app in a browser
        run: soli test tests/browser --browser --no-coverage

  # The browser engraver's editing half (wasm/src/editor.rs), tested natively
  # against every gallery piece: the edits the playground makes.
  engraver:
    name: browser engraver + editor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: wasm
      - name: Tests
        working-directory: wasm
        run: cargo test --release

  # The editor's model (public/eui-score/score-model.js), engraved by the
  # WebAssembly module the site ships.
  editor:
    name: score editor model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests
        run: node --test tests/js/*.test.mjs

  deploy:
    name: deploy score.solisoft.net
    needs: [verify, engraver, editor]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN || 'score.solisoft.net' }}
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ vars.DEPLOY_USER || 'rocky' }}
      SITES_DIR: ${{ vars.DEPLOY_SITES_DIR || '/home/rocky/sites' }}
      # The routing rules soli-proxy takes with -c (proxy.conf, not config.toml).
      PROXY_CONF: ${{ vars.DEPLOY_PROXY_CONF || '/home/rocky/proxy.conf' }}
      DOMAIN: ${{ vars.DEPLOY_DOMAIN || 'score.solisoft.net' }}
      # The `name` in the server's app.infos.
      APP: ${{ vars.DEPLOY_APP || 'score' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the configuration
        run: |
          set -euo pipefail
          [ -n "$HOST" ] || { echo "secret DEPLOY_HOST is missing" >&2; exit 1; }
          echo "Target: $USER@$HOST:$SITES_DIR/$DOMAIN"

      - name: Prepare SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # known_hosts, not StrictHostKeyChecking=no: host verification stays on.
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The site is created by hand once (app.infos + .env); this workflow
      # creates nothing on the server.
      - name: Check the site exists on the server
        run: |
          ssh "$USER@$HOST" "test -f '$SITES_DIR/$DOMAIN/app.infos' && test -f '$SITES_DIR/$DOMAIN/.env'" \
            || { echo "$SITES_DIR/$DOMAIN must hold app.infos and .env — see deploy/README.md" >&2; exit 1; }

      # The players' sounds are not in git (38 MB): fetched, checked against
      # their SHA-256, kept between runs. Before the rsync, which would
      # otherwise take them off the server.
      - name: Keep the sounds between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: public/soundfonts/MuseScore_General.sf3
          key: soundfont-${{ hashFiles('deploy/soundfont.sh') }}

      - name: Fetch the sounds
        run: deploy/soundfont.sh

      # --delete-delay: what leaves the repository leaves the server. The
      # exclusions keep what lives only on the server, and what has no
      # business there (the Rust crate, tests, agent notes). public/ is
      # served as is: an agent note `soli update docs` writes back into
      # public/js/ must never reach it (#544).
      - name: Sync the files
        run: |
          set -euo pipefail
          rsync -rlzv --delete-delay --delay-updates \
            --exclude='.git/' --exclude='.github/' --exclude='.claude/' \
            --exclude='wasm/' --exclude='tests/' --exclude='coverage/' --exclude='tmp/' \
            --exclude='.env' --exclude='.env.*' --exclude='app.infos' --exclude='restart.txt' \
            --exclude='/public/js/CLAUDE.md' \
            ./ "$USER@$HOST:$SITES_DIR/$DOMAIN/"

      # The exclusion above also shields the copy an older deploy put on the
      # server from --delete: taken off here, every time (nothing left, nothing
      # done), so /js/CLAUDE.md is never served.
      - name: Take the agents' notes off the server
        run: ssh "$USER@$HOST" "rm -f '$SITES_DIR/$DOMAIN/public/js/CLAUDE.md'"

      - name: Note the version the server runs
        run: |
          installed="$(ssh "$USER@$HOST" 'soli --version' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "server: $installed — pinned: $SOLI_VERSION"
          if [ "$installed" != "$SOLI_VERSION" ]; then
            echo "::warning::the server runs Soli $installed; this run tested $SOLI_VERSION"
          fi

      # Only where the server has a database: see deploy/README.md.
      - name: Migrations
        run: |
          set -euo pipefail
          if ssh "$USER@$HOST" "grep -qE '^SOLIDB_HOST=.+' '$SITES_DIR/$DOMAIN/.env'"; then
            ssh "$USER@$HOST" "set -e; cd '$SITES_DIR/$DOMAIN' && soli db:migrate up"
          else
            echo "::notice::no SOLIDB_HOST in the server's .env: migrations skipped, /app shows its set-up page"
          fi

      # `soli-proxy deploy` rather than touching restart.txt: it waits for
      # the new slot and fails loudly when it cannot start.
      - name: Switch the blue-green slot
        run: ssh "$USER@$HOST" "soli-proxy deploy -c '$PROXY_CONF' '$APP' 2>&1"

      # After a switch the proxy balances across both slot ports; restart
      # brings both up on the new code.
      - name: Bring both slots up
        run: ssh "$USER@$HOST" "soli-proxy restart -c '$PROXY_CONF' '$APP'"

      # End to end, through the proxy, with the real hostname. /health only
      # says the process runs; /health/deep that its database answers and
      # no job is left far behind (503 with the reason otherwise), and /app
      # answers 200 or sends a visitor to /login: a broken migration or a
      # stopped database fails the deploy here.
      - name: Check the site through the proxy
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            sleep 4
            codes="$(ssh "$USER@$HOST" "for p in /health /health/deep / /examples /eui-score/eui_score_web_bg.wasm; do curl -sk -m 8 --resolve '$DOMAIN:443:127.0.0.1' -o /dev/null -w '%{http_code} ' \"https://$DOMAIN\$p\"; done" || true)"
            app="$(ssh "$USER@$HOST" "curl -sk -m 8 --resolve '$DOMAIN:443:127.0.0.1' -o /dev/null -w '%{http_code} %{redirect_url}' 'https://$DOMAIN/app'" || true)"
            # The app's own answer, not a 200 from something in front of it.
            ready="$(ssh "$USER@$HOST" "curl -sk -m 8 --resolve '$DOMAIN:443:127.0.0.1' 'https://$DOMAIN/health/deep'" || true)"
            echo "attempt $attempt: $codes| /app -> $app | ready: $ready"
            if [ "$codes" = "200 200 200 200 200 " ] && echo "$ready" | grep -q '"status":"ok"'; then
              case "$app" in
                "200 "|"302 "*/login*|"303 "*/login*) exit 0 ;;
              esac
            fi
          done
          echo "The site does not answer through the proxy, or is not ready:" >&2
          ssh "$USER@$HOST" "curl -sk -m 8 --resolve '$DOMAIN:443:127.0.0.1' 'https://$DOMAIN/health/deep'" >&2 || true
          echo >&2
          echo "  ssh $USER@$HOST 'soli-proxy logs -c $PROXY_CONF $APP'" >&2
          exit 1
