# Every 15 minutes, from outside: is score.solisoft.net up and ready? The
# run fails when /health/deep does not answer 200 (database down, jobs
# left far behind, site down) and GitHub mails the failure to whoever is
# set to receive Actions notifications for this repository (by default the
# owner; Settings > Notifications > Actions). It prints the reason the
# page gives, nothing else.
name: uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: score.solisoft.net/health/deep answers 200
        env:
          URL: https://${{ vars.DEPLOY_DOMAIN || 'score.solisoft.net' }}/health/deep
        run: |
          for attempt in 1 2 3; do
            code="$(curl -s -m 15 -o /tmp/ready.json -w '%{http_code}' "$URL" || echo 000)"
            echo "attempt $attempt: $code $(head -c 300 /tmp/ready.json 2>/dev/null)"
            [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/ready.json && exit 0
            sleep 20
          done
          echo "::error::$URL answers $code"
          exit 1
