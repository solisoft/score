# The production database, run by hand (Actions > production database >
# Run workflow): the server is reached only with the deploy key.
#
#   inspect — what the server has: SoliDB, its port, and how the other sites
#             on it reach it (hosts, databases, user names; never a password).
#   setup   — gives this site its database as the server's other sites have
#             theirs: SoliDB on 127.0.0.1:6745 as its admin, a database of its
#             own (score), the admin password and the mail relay copied on the
#             server from crm.solisoft.net's .env, a session secret made there.
#             Nothing secret leaves the server. The .env is kept beside as
#             .env.before-db, and nothing is done if it names a database already.
#             The next deploy runs the migrations and opens /app.
#   encryption-key — SOLI_ENCRYPTION_KEY, made on the server if the .env has
#             none: two-step sign-in secrets are encrypted with it. Never
#             replaced (the secrets kept with it would no longer open).
name: production database

on:
  workflow_dispatch:
    inputs:
      action:
        description: "inspect, setup, or encryption-key"
        required: true
        default: inspect
        type: choice
        options: [inspect, setup, encryption-key]

concurrency:
  group: deploy-refs/heads/main
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ vars.DEPLOY_USER || 'rocky' }}
      SITES_DIR: ${{ vars.DEPLOY_SITES_DIR || '/home/rocky/sites' }}
      DOMAIN: ${{ vars.DEPLOY_DOMAIN || 'score.solisoft.net' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect
        if: inputs.action == 'inspect'
        run: |
          ssh "$USER@$HOST" SITES_DIR="$SITES_DIR" DOMAIN="$DOMAIN" bash -s <<'REMOTE'
          hide() { sed -E 's/((PASS|PASSWORD|SECRET|TOKEN|KEY)[A-Z_]*[= ])[^ ]*/\1<hidden>/Ig'; }
          echo "== solidb"
          command -v solidb && solidb --version 2>&1 | head -1
          echo "== processes"
          ps -eo user,args | grep -i '[s]olidb' | hide | head -5
          echo "== services"
          systemctl list-units --type=service --all 2>/dev/null | grep -i solidb | head -5
          echo "== listening"
          (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -E ':6745|:67[0-9][0-9]' | head -5
          echo "== answers"
          curl -s -o /dev/null -w '127.0.0.1:6745 -> %{http_code}\n' -m 3 http://127.0.0.1:6745/_api/databases || echo "127.0.0.1:6745 -> nothing"
          echo "== the sites and their database"
          for d in "$SITES_DIR"/*/; do
            f="$d.env"
            [ -f "$f" ] || continue
            printf '%s: ' "$(basename "$d")"
            grep -E '^(SOLIDB_HOST|SOLIDB_DATABASE|SOLIDB_USERNAME|SOLI_MAIL_DELIVERY_METHOD|SOLI_SMTP_HOST|SOLI_SMTP_FROM)=' "$f" | tr '\n' ' '
            grep -qE '^SOLIDB_PASSWORD=.+' "$f" && printf 'SOLIDB_PASSWORD=<set> '
            grep -qE '^SOLI_SESSION_SECRET=.+' "$f" && printf 'SOLI_SESSION_SECRET=<set>'
            echo
          done
          REMOTE

      - name: Set up
        if: inputs.action == 'setup'
        run: |
          ssh "$USER@$HOST" SITES_DIR="$SITES_DIR" DOMAIN="$DOMAIN" bash -s <<'REMOTE'
          set -euo pipefail
          site="$SITES_DIR/$DOMAIN"
          from="$SITES_DIR/crm.solisoft.net/.env"
          cd "$site"
          if grep -qE '^SOLIDB_HOST=.+' .env; then
            echo "this site's .env names a database already: nothing done"; exit 0
          fi
          if grep -lE '^SOLIDB_DATABASE=score$' "$SITES_DIR"/*/.env 2>/dev/null | grep -v "^$site/" ; then
            echo "another site uses a database called score: nothing done" >&2; exit 1
          fi
          [ -f "$from" ] || { echo "$from is missing" >&2; exit 1; }
          value() { grep -E "^$1=" "$from" | head -1 | cut -d= -f2-; }
          [ -n "$(value SOLIDB_PASSWORD)" ] || { echo "no SOLIDB_PASSWORD in $from" >&2; exit 1; }
          cp -p .env .env.before-db
          {
            echo ""
            echo "# The app's database (/app): SoliDB on this server, as its other sites have theirs."
            echo "SOLIDB_HOST=http://127.0.0.1:6745"
            echo "SOLIDB_DATABASE=score"
            echo "SOLIDB_USERNAME=admin"
            echo "SOLIDB_PASSWORD=$(value SOLIDB_PASSWORD)"
            echo "SOLI_SESSION_SECRET=$(openssl rand -hex 32)"
            echo "# Mail (password reset, confirmation, shares): the relay crm.solisoft.net uses."
            echo "SOLI_MAIL_DELIVERY_METHOD=smtp"
            for k in SOLI_SMTP_HOST SOLI_SMTP_PORT SOLI_SMTP_USER SOLI_SMTP_PASS; do
              v="$(value $k)"
              if [ -n "$v" ]; then echo "$k=$v"; fi
            done
            echo "SOLI_SMTP_FROM=EUI Score <no-reply@solisoft.net>"
          } >> .env
          chmod 600 .env
          echo "done: the names now set, without their values:"
          grep -E '^(SOLIDB_|SOLI_SESSION|SOLI_MAIL|SOLI_SMTP)' .env | cut -d= -f1 | tr '\n' ' '; echo
          curl -s -o /dev/null -w 'SoliDB answers: %{http_code}\n' -m 3 http://127.0.0.1:6745/_api/databases || true
          REMOTE

      - name: Encryption key
        if: inputs.action == 'encryption-key'
        run: |
          ssh "$USER@$HOST" SITES_DIR="$SITES_DIR" DOMAIN="$DOMAIN" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$SITES_DIR/$DOMAIN"
          if grep -qE '^SOLI_ENCRYPTION_KEY=.+' .env; then
            echo "the .env has its key already: nothing done"; exit 0
          fi
          cp -p .env .env.before-key
          printf '\n# Two-step sign-in secrets are encrypted with it: never replace it.\nSOLI_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          chmod 600 .env
          echo "done: SOLI_ENCRYPTION_KEY added (its value stays on the server)"
          REMOTE
